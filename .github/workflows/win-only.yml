name: win-only

on:
  workflow_dispatch:
  push:
    branches:
      - 'develop'
  pull_request:
    branches:
      - 'develop'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows_vs2022_x64
            os: windows-2022
            build_type: Release
            env_cc: ''
            env_cxx: ''
            compiler: msvc
            vs_arch: x64
            vs_version: 2022
            qt_version: 6.11.0
            qt_arch_aqt: win64_msvc2022_64
            qt_arch_dir: msvc2022_64
            qt_modules: qtimageformats qtmultimedia qtpositioning qtserialport
            qt_tools: ''
            conan_package_manager: ''
            conan_profile: scwx-windows_vs2022_x64
            artifact_suffix: windows-vs2022-x64

    name: ${{ matrix.name }}
    env:
      CC: ${{ matrix.env_cc }}
      CXX: ${{ matrix.env_cxx }}
      SCWX_VERSION: v0.5.6
      SCCACHE_DIR: ${{ github.workspace }}\.sccache

    runs-on: ${{ matrix.os }}

    steps:
    - name: Setup Git
      run: git config --global core.longpaths true

    - name: Checkout
      uses: actions/checkout@v4
      with:
        path: source
        submodules: recursive

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
        cache: 'pip'

    - name: Install Build Tools
      shell: pwsh
      run: |
        pip install geopandas GitPython conan sccache

    - name: Cache Qt
      id: cache-qt
      uses: actions/cache@v4
      with:
        path: ${{ runner.workspace }}/Qt
        key: qt-${{ matrix.qt_version }}-${{ matrix.qt_arch_aqt }}-${{ matrix.qt_modules }}

    - name: Install Qt
      if: steps.cache-qt.outputs.cache-hit != 'true'
      uses: jdpurcell/install-qt-action@v5
      env:
        AQT_CONFIG: ${{ github.workspace }}/source/tools/aqt-settings.ini
      with:
        version: ${{ matrix.qt_version }}
        arch: ${{ matrix.qt_arch_aqt }}
        modules: ${{ matrix.qt_modules }}
        tools: ${{ matrix.qt_tools }}
        aqtsource: git+https://github.com/miurahr/aqtinstall.git@073e34d7c2ab4ae6961ed7cca690b3abd5ba5a7e

    - name: Setup MSVC
      if: matrix.compiler == 'msvc'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        $vsDevCmd = Join-Path $vsPath "Common7\Tools\VsDevCmd.bat"
        $arch = if ("${{ matrix.vs_arch }}" -eq "x64") { "amd64" } else { "${{ matrix.vs_arch }}" }
        cmd.exe /d /s /c """$vsDevCmd"" -arch=$arch -host_arch=$arch && set" | ForEach-Object {
          if ($_ -match "^(.*?)=(.*)$") { "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append }
        }

    - name: sccache Cache
      uses: actions/cache@v4
      with:
        path: ${{ env.SCCACHE_DIR }}
        key: sccache-${{ matrix.name }}-${{ github.run_id }}
        restore-keys: sccache-${{ matrix.name }}-

    - name: Cache Conan Packages
      uses: actions/cache@v4
      with:
        path: ~/.conan2
        key: conan-v2-${{ matrix.conan_profile }}-${{ hashFiles('source/conanfile.py', 'source/tools/conan/profiles/*') }}

    - name: Install Conan Packages
      shell: pwsh
      run: |
        conan config install ./source/tools/conan/profiles/${{ matrix.conan_profile }} -tf profiles
        if (-not (Test-Path build)) { mkdir build }
        cd build
        if (-not (Test-Path conan)) { mkdir conan }
        conan install ../source/ --build missing --profile:all ${{ matrix.conan_profile }} --settings:all build_type=${{ matrix.build_type }} --output-folder ./conan/
        conan cache clean

    - name: Build Supercell Wx
      shell: pwsh
      run: |
        sccache --start-server
        if (-not (Test-Path build)) { mkdir build }
        cd build
        
        # KEY CHANGES: Force /Z7 and /FS globally to satisfy sccache
        cmake ../source/ `
          -G Ninja `
          -DCMAKE_BUILD_TYPE="Release" `
          -DCMAKE_POLICY_DEFAULT_CMP0141=NEW `
          -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT="Embedded" `
          -DCMAKE_CXX_FLAGS_RELEASE="/O2 /Ob2 /DNDEBUG /Z7 /FS" `
          -DCMAKE_C_FLAGS_RELEASE="/O2 /Ob2 /DNDEBUG /Z7 /FS" `
          -DCMAKE_C_COMPILER_LAUNCHER=sccache `
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
          -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES="${{ github.workspace }}/source/external/cmake-conan/conan_provider.cmake" `
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/supercell-wx" `
          -DCONAN_HOST_PROFILE="${{ matrix.conan_profile }}" `
          -DCONAN_BUILD_PROFILE="${{ matrix.conan_profile }}"
        
        ninja supercell-wx wxtest
        sccache --show-stats

    - name: Install Supercell Wx
      shell: pwsh
      run: |
        cd build
        cmake --install . --component supercell-wx

    - name: Upload Artifacts (Windows)
      uses: actions/upload-artifact@v4
      with:
        name: supercell-wx-${{ matrix.artifact_suffix }}
        path: ${{ github.workspace }}/supercell-wx/

    - name: Build Installer (Windows)
      shell: pwsh
      run: |
        cd build
        cpack

    - name: Upload Installer (Windows)
      uses: actions/upload-artifact@v4
      with:
        name: supercell-wx-installer-${{ matrix.artifact_suffix }}
        path: ${{ github.workspace }}/build/supercell-wx-*.msi*

    - name: Test Supercell Wx
      working-directory: ${{ github.workspace }}/build
      env:
        MAPBOX_API_KEY:   ${{ secrets.MAPBOX_API_KEY }}
        MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}
      run: ctest -C ${{ matrix.build_type }} --exclude-regex "test_mln.*|NtpClient.*|UpdateManager.*"
